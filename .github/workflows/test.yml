name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --global tree-sitter-cli@0.26.8
      - run: nvim --headless -u NONE -l tests/check.lua
      - run: nvim --headless -u NONE --cmd 'set rtp^=.' -c 'lua require("pooka").install_grammar()' -c 'qa!'
      - run: nvim --headless -u NONE -l tests/check.lua
